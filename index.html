<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REA Reverse ER Repo</title>
  <meta name="description" content="Project homepage for REA Reverse ER Repo.">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background: radial-gradient(ellipse at top, #1e3a5f 0%, #0b1020 55%, #05070d 100%); color: #f3f6ff; }
    main { width: min(760px, 100%); padding: clamp(28px, 6vw, 56px); border: 1px solid #344361; border-radius: 24px; background: #0b1220dd; box-shadow: 0 24px 80px #0008; }
    .tag { display: inline-block; padding: 7px 12px; border: 1px solid #47638e; border-radius: 999px; color: #9dc5ff; font-size: .82rem; letter-spacing: .08em; text-transform: uppercase; }
    h1 { font-size: clamp(2rem, 7vw, 4rem); line-height: 1.05; margin: 22px 0 16px; overflow-wrap: anywhere; }
    p { color: #bac7dc; line-height: 1.7; font-size: 1.05rem; }
    a { color: #9dc5ff; }
    .links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .links a { padding: 12px 18px; border-radius: 10px; text-decoration: none; font-weight: 650; border: 1px solid #46618b; }
    .links a:first-child { color: #07101f; background: #9dc5ff; border-color: #9dc5ff; }
    footer { margin-top: 36px; font-size: .85rem; color: #8190a9; }
  </style>
</head>
<body>
  <main>
    <span class="tag">Project homepage</span>
    <h1>REA Reverse ER Repo</h1>
    <p>This is the live homepage for the project. Add a project overview, documentation, screenshots, and usage instructions as the repository develops.</p>
    <div class="links">
      <a href="https://github.com/aneeshsinha82-design/REA-REVERSE-ER-REPO-">View repository</a>
      <a href="https://github.com/aneeshsinha82-design/REA-REVERSE-ER-REPO-/issues">Issues &amp; feedback</a>
    </div>
    <footer>Hosted with GitHub Pages</footer>
  </main>
</body>
</html>
